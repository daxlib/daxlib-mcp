name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Windows is the published platform. Linux and macOS are a build try: the catalog tools and
    # get_function_definitions need no Windows API, but a failure there does not fail the run yet.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Nerdbank.GitVersioning to compute the version height.

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build DaxLib.Mcp.slnx --configuration Release -warnaserror

      - name: Test
        run: dotnet test --solution DaxLib.Mcp.slnx --configuration Release --no-build
