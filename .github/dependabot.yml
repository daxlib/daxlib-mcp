version: 2

updates:
  # global.json pins the SDK exactly, so security patches to the runtime bundled in the executable
  # arrive only through this update. Each update also changes the implicit ILLink.Tasks reference:
  # run `dotnet restore DaxLib.Mcp.slnx --force-evaluate` on the branch and commit the lock files.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # The project targets .NET 10 (LTS); a new major SDK is a deliberate migration.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
